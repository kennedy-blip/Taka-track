name: Flutter CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=web,android --org com.takatrack .\n      - run: flutter pub get
      - run: dart format lib
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --base-href /
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: TakaTrack-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
