name: Flutter CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java for Android builds
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Flutter platform scaffolding
        run: flutter create --platforms=web,android --org com.takatrack .
      - run: flutter pub get
      - run: dart format lib
      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build web --release --base-href /
      - name: Build Android APK
        run: flutter build apk --release --android-skip-build-dependency-validation
      - uses: actions/upload-artifact@v4
        with:
          name: TakaTrack-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
